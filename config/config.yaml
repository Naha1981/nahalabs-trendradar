# NahaLabs internal RSS-only pilot. Upstream config schema2.4.0.
app:
  timezone: Africa/Johannesburg
  show_version_update: false
schedule:
  enabled: false
  preset: morning_evening
platforms:
  enabled: false
  api_url: ''
  sources: []
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 3
  feeds:
  - id: freightnews-za
    name: Freight News (SA)
    url: https://www.freightnews.co.za/rss.xml
  - id: africa-ports
    name: Africa Ports
    url: https://www.africaports.co.za/feed
  - id: port-strategy
    name: Port Strategy
    url: https://www.portstrategy.com/rss
  - id: joc
    name: Journal of Commerce
    url: https://www.joc.com/rss.xml
  - id: splash247
    name: Splash247
    url: https://splash247.com/feed/
  - id: gcaptain
    name: gCaptain
    url: https://gcaptain.com/feed/
  - id: supply-chain-dive
    name: Supply Chain Dive
    url: https://www.supplychaindive.com/feeds/news/
  - id: gnews-beitbridge
    name: Google News - Beitbridge border delays
    url: https://news.google.com/rss/search?q=Beitbridge+border+delays+when:7d&hl=en-ZA&gl=ZA&ceid=ZA:en
  - id: gnews-transnet-ports
    name: Google News - Transnet ports
    url: https://news.google.com/rss/search?q=Transnet+port+when:7d&hl=en-ZA&gl=ZA&ceid=ZA:en
  - id: moneyweb
    name: Moneyweb
    url: https://www.moneyweb.co.za/feed/
  - id: businesstech
    name: BusinessTech
    url: https://businesstech.co.za/news/feed/
  - id: techcentral
    name: TechCentral
    url: https://techcentral.co.za/feed/
report:
  mode: daily
  display_mode: keyword
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 0
filter:
  method: keyword
  priority_sort_enabled: true
ai_filter:
  batch_size: 200
  batch_interval: 2
  min_score: 0.7
  reclassify_threshold: 0.6
  prompt_file: prompt.txt
  extract_prompt_file: extract_prompt.txt
  update_tags_prompt_file: update_tags_prompt.txt
display:
  region_order:
  - new_items
  - hotlist
  - rss
  - standalone
  - ai_analysis
  regions:
    hotlist: false
    new_items: false
    rss: true
    standalone: false
    ai_analysis: false
  standalone:
    platforms: []
    rss_feeds: []
    max_items: 20
notification:
  enabled: false
  channels:
    feishu:
      webhook_url: ''
    dingtalk:
      webhook_url: ''
    wework:
      webhook_url: ''
      msg_type: ''
    telegram:
      bot_token: ''
      chat_id: ''
    email:
      from: ''
      password: ''
      to: ''
      smtp_server: ''
      smtp_port: ''
    ntfy:
      server_url: ''
      topic: ''
      token: ''
    bark:
      url: ''
    slack:
      webhook_url: ''
    generic_webhook:
      webhook_url: ''
      payload_template: ''
storage:
  backend: local
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: output
    retention_days: 14
  remote:
    retention_days: 14
    endpoint_url: ''
    bucket_name: ''
    access_key_id: ''
    secret_access_key: ''
    region: ''
  pull:
    enabled: false
    days: 7
ai:
  model: ''
  api_key: ''
  api_base: ''
  timeout: 120
  temperature: 1.0
  max_tokens: 5000
  num_retries: 1
  fallback_models: []
ai_analysis:
  enabled: false
  language: Chinese
  prompt_file: ai_analysis_prompt.txt
  mode: follow_report
  max_news_for_analysis: 150
  include_rss: false
  include_standalone: true
  include_rank_timeline: true
ai_translation:
  enabled: false
  language: 中文
  prompt_file: ai_translation_prompt.txt
  batch_size: 100
  batch_interval: 2
  scope:
    hotlist: false
    rss: true
    standalone: true
advanced:
  debug: false
  version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version
  mcp_version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp
  configs_version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: http://127.0.0.1:10801
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ''
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 3
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: ━━━━━━━━━━━━━━━━
