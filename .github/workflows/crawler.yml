name: NahaLabs TrendRadar RSS pilot
'on':
  schedule:
    - cron: '17 5,11,16 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nahalabs-rss-pilot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RSS-only runtime (no AI or MCP)
        run: python -m pip install --disable-pip-version-check -r requirements-pilot.txt
      - name: Verify RSS-only pilot guardrails
        run: python -m scripts.verify_pilot
      - name: Collect RSS and match keywords
        env:
          GITHUB_ACTIONS: 'true'
        run: python -m trendradar
      - name: Verify generated reports and freshness
        run: python -m scripts.verify_report
      - name: Keep public-news report artifact
        uses: actions/upload-artifact@v4
        with:
          name: trendradar-report
          path: |
            output/html/**/*.html
            output/pilot-run-summary.json
          retention-days: 14
          if-no-files-found: error
